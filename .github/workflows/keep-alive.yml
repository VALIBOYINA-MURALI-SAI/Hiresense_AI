name: Keep Streamlit Cloud Alive
on:
  schedule:
    # Every 20 minutes, 24/7. Streamlit Community Cloud sleeps after ~7 days
    # of inactivity; periodic pings prevent that.
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app
        env:
          APP_URL: ${{ vars.STREAMLIT_APP_URL || 'https://hire-sense-ai-srm.streamlit.app/' }}
        run: |
          set -euo pipefail

          echo "Pinging $APP_URL"

          HTTP_CODE=$(curl -sS -L --max-redirs 10 \
            -c /tmp/cookies.txt -b /tmp/cookies.txt \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            --retry 3 --retry-delay 5 --retry-connrefused \
            --max-time 30 \
            -o /dev/null \
            -w "%{http_code}" \
            "$APP_URL" || echo "000")

          echo "Final HTTP status: $HTTP_CODE"

          if [[ "$HTTP_CODE" == "000" ]]; then
            echo "❌ Could not reach app"
            exit 1
          elif [[ "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]; then
            echo "✅ App is up (HTTP $HTTP_CODE)"
          else
            echo "⚠️ App responded but with unexpected status: $HTTP_CODE"
            exit 1
          fi
